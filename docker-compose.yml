services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gferraz
      POSTGRES_USER: gferraz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gferraz_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gferraz -d gferraz"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gferraz:${POSTGRES_PASSWORD:-gferraz_local_dev}@db:5432/gferraz
      API_PORT: 3001
      API_HOST: 0.0.0.0
      MEDIA_ROOT: /app/media
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:-./.data/GFerraz Makeup}
        target: /app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
